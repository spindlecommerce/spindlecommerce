"""What a template renders: product pages or category pages."""
enum TemplateFor {
  CATEGORY
  PRODUCT
}

"""The template a product or category page renders with, and why."""
type TemplateMatch {
  """The category the template is assigned to, when source is CATEGORY."""
  category: Category
  page: Page
  source: TemplateSource
}

enum TemplateSource {
  """
  Assigned to a category: for a product, the nearest of its categories and their parents; for a category, this one.
  """
  CATEGORY

  """The default template."""
  DEFAULT

  """Assigned to this product."""
  PRODUCT
}

"""
What a template is assigned to. Each product, category and the default has one published template; a draft takes over its assignments when published.
"""
type TemplateTargets {
  """
  Product templates: the products in these categories and their subcategories. Category templates: these category pages.
  """
  categories: [Category!]

  """
  Renders every product (or category) page no other template is assigned to.
  """
  isDefault: Boolean

  """Product templates: these products."""
  products: [Product!]
}

"""
Omitted fields are unchanged; lists replace the template's products or categories. A published template takes them over at once, a draft one when published.
"""
input TemplateTargetsInput {
  """
  Product templates: the products in these categories and their subcategories. Category templates: these category pages.
  """
  categoryIds: [ID!]

  """
  Make this the default template of its kind (the current default stops being one once this template is published), or stop being the default.
  """
  isDefault: Boolean

  """Product templates only."""
  productIds: [ID!]
}

