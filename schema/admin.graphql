  ORDER_SHIPPED

  """To the new order notification addresses (order.placed)."""
  STAFF_NEW_ORDER

  """
  The reset link a staff member asked for (staff.password_reset_requested).
  """
  STAFF_PASSWORD_RESET

  """Sent from the admin (emailSendTest)."""
  TEST
}

