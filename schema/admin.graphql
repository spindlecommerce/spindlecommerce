enum EmailTemplate {
  """
  The reset link a customer asked for (customer.password_reset_requested).
  """
  CUSTOMER_PASSWORD_RESET

  """To the low stock recipients (inventory.level_changed)."""
  LOW_STOCK

  """To the customer when an order is canceled (order.canceled)."""
  ORDER_CANCELED

  """To the customer when an order is placed (order.placed)."""
  ORDER_CONFIRMATION

  """To the customer for each refund (order.refunded)."""
  ORDER_REFUNDED

  """
  To the customer for each shipment, with tracking links (order.fulfilled).
