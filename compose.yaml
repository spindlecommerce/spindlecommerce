# Local development: the API with hot reload, plus PostgreSQL.
#
#   docker compose up --build                 admin app http://localhost:4000/admin/ (hot reload),
#                                             storefront API /graphql, admin API /admin/graphql
#   docker compose run --rm app pnpm test     tests (they use in-memory PGlite, not this database)
#   docker compose down -v                    stop and delete the database and dependency volumes
name: ecom

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgres://ecom:ecom@postgres:5432/ecom
      PORT: "4000"
      NODE_ENV: development
      # Development-only secret; fixed so sessions survive restarts.
      JWT_SECRET: dev-only-change-me-dev-only-change-me
      DEFAULT_CHANNEL: us
      # Lets webhooks target receivers on your machine (http://host.docker.internal:…).
      ALLOW_PRIVATE_WEBHOOK_URLS: "true"
      MIGRATE_ON_START: "true"
      SEED_ON_START: "true"
    volumes:
      - .:/app
      # Keep the container's Linux dependencies separate from any node_modules on the host.
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm/store
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: ecom
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  node_modules:
  pnpm-store:
  postgres-data:
