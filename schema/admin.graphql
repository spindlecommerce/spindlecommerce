type Category implements Node {
  """Root first, for breadcrumbs. Excludes this category."""
  ancestors: [Category!]
  children: [Category!]
  depth: Int
  description: String
  id: ID!
  isActive: Boolean

  """
  The category's listing as the merchandising board shows it: pinned products in order, then hidden ones, then the rest newest first (the FEATURED sort). Covers products in the category or below it, drafts included, archived ones not.
  """
  merchandising(
    """Up to 500; default 250."""
    first: Int
  ): CategoryMerchandising
  name: String
  parent: Category

  """Slugs from the root, e.g. "men/mens-shirts"."""
  path: String
  position: Int
  products(
    after: String
    before: String
    filter: ProductFilter
    first: Int
    last: Int

    """Full-text search with prefix matching, e.g. "trail run"."""
    query: String

    """
    Defaults to RELEVANCE with a query, then to FEATURED in a category's listing, otherwise NEWEST.
    """
    sort: ProductSortInput
  ): ProductConnection

  """
  This category's own sections, to render with the category as data where its template places the category sections component. Null when it has none. Drafts appear only with a preview token.
  """
  sections: Page
  slug: String

  """
  The page builder template for this category's page: the one assigned to the category, else the default. Render its content with the category as data. Null means none: use your built-in layout. Drafts appear only with a preview token.
  """
  template: Page
  templateMatch(
    """
    Only count published templates: what visitors see now. By default unpublished ones count too.
    """
    live: Boolean
  ): TemplateMatch
  translations: [CategoryTranslation!]
}

union CategoryCreateResult = AuthenticationError | CategoryPayload | NotFoundError | PermissionDeniedError | ValidationError

union CategoryDeleteResult = AuthenticationError | DeletePayload | NotFoundError | PermissionDeniedError | ValidationError

input CategoryInput {
  isActive: Boolean
  parentId: ID

  """
  Index among its siblings (0 is first); default last. Siblings are renumbered.
  """
  position: Int
  translations: [CategoryTranslationInput!]!
}

type CategoryMerchandising {
  items: [CategoryMerchandisingItem!]

  """Products in the listing; `items` stops at `first`."""
  totalCount: Int
}

input CategoryMerchandisingInput {
  """
  Left out of this category's listing, in every sort. Its parents' listings have their own.
