"""A component or content type in the page builder's library."""
type Component implements Node {
  """Stable identifier; pages and frontends refer to components by code."""
  code: String
  createdAt: DateTime

  """The definition as componentsSync accepts it."""
  definition: JSON
  description: String

  """
  Field definitions: { key, type, label, required, localized, options, allowedComponents, fields, … }.
  """
  fields: JSON
  groupName: String

  """A lucide icon name."""
  icon: String
  id: ID!
  kind: ComponentKind
  name: String
  previewImageUrl: String
  revision: Int
  routable: Boolean

  """
  Content types only: its pages are one product's or category's own sections, which templates show where they place a sections component.
  """
  sectionsFor: TemplateFor
  singleton: Boolean
  source: ComponentSource

  """
  Content types: its pages are product or category templates. Components: shows that object's data, so it only fits those templates (and that kind's sections).
  """
  templateFor: TemplateFor
  updatedAt: DateTime

  """Pages whose draft or published version uses it."""
  usageCount: Int
  variations: JSON
}

union ComponentCreateResult = AuthenticationError | ComponentPayload | NotFoundError | PermissionDeniedError | ValidationError

union ComponentDeleteResult = AuthenticationError | DeletePayload | InvalidStateError | NotFoundError | PermissionDeniedError | ValidationError

"""
A definition. fields and variations take the JSON shapes Component returns.
"""
input ComponentInput {
  """Required when creating; fixed afterwards."""
  code: String
  description: String
  fields: JSON
  groupName: String
  icon: String

  """Required when creating; fixed afterwards."""
  kind: ComponentKind
  name: String
  previewImageUrl: String
  routable: Boolean

  """
  Content types: its pages are one product's or category's own sections, which templates show where they place a sections component. Fixed while pages use it.
  """
  sectionsFor: TemplateFor
  singleton: Boolean

  """
  Content types: make its pages product or category templates. Components: shows that object's data. Fixed while pages use it.
  """
  templateFor: TemplateFor
  variations: JSON
}

enum ComponentKind {
  """Nests inside a content type's or component's blocks fields."""
  COMPONENT

  """The root of a page, e.g. a landing page or the site header."""
  CONTENT_TYPE
}

type ComponentPayload {
  component: Component
