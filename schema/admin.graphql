  """Channel code, e.g. eu."""
  channel: String

  """ISO 4217 code, e.g. GBP."""
  currency: String

  """BCP 47 locale, e.g. de-DE."""
  locale: String
) on MUTATION | QUERY | SUBSCRIPTION

