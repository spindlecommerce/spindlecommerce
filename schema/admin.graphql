"""Where media files are stored."""
enum MediaStorageProvider {
  """
  Files on the API server's disk, served at /media/. For development, Docker and single servers.
  """
  LOCAL

  """
  S3-compatible object storage: AWS S3, Cloudflare R2, Supabase Storage, MinIO.
  """
  S3

  """A Vercel Blob store."""
  VERCEL_BLOB
}

"""
Where to upload a file, straight to storage. LOCAL and S3: send `method` to `url` with `headers` and the file as the body. VERCEL_BLOB: `put(pathname, file, { access: "public", token: clientToken, contentType, multipart })` from @vercel/blob/client. Then call mediaAssetCreate with `key`.
"""
type MediaUpload {
  """
  VERCEL_BLOB: the token for put() from @vercel/blob/client, limited to this pathname, type and size.
  """
  clientToken: String

  """When the url or clientToken stops working."""
  expiresAt: DateTime

  """
  Headers to send with the PUT, e.g. { "Content-Type": "image/png" }; they are part of the signature. The body must be exactly the declared size.
  """
  headers: JSON

  """Pass to mediaAssetCreate once the upload has finished."""
  key: String

  """The largest file accepted."""
  maxBytes: Int

  """PUT."""
  method: String

  """VERCEL_BLOB: the pathname to put to."""
  pathname: String
  provider: MediaStorageProvider

  """Where the file will be served from."""
  publicUrl: String

  """
  LOCAL: a path on this API, with a signed token (resolve it against the API's URL). S3: a presigned URL. Null for VERCEL_BLOB.
  """
  url: String
}

input MediaUploadCreateInput {
  """
  One of MediaStorageInfo.allowedContentTypes, e.g. File.type in a browser.
  """
  contentType: String!

  """The file's name; it becomes part of the URL, slugified."""
  filename: String!

  """In bytes; the upload must be exactly this size."""
  size: Int!
}

union MediaUploadCreateResult = AuthenticationError | InvalidStateError | MediaUploadPayload | NotFoundError | PermissionDeniedError | ValidationError

type MediaUploadPayload {
  upload: MediaUpload
}

